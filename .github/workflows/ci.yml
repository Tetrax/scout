name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          fixture="$HOME/.hermes/hermes-agent"
          test ! -e "$fixture"
          umask 077
          mkdir -p "$fixture/venv/bin"
          trap 'rm -rf "$fixture"' EXIT
          printf '%s\n' \
            'TOOLSETS = {"context_engine": {"tools": [], "includes": []}}' \
            'def resolve_toolset(name):' \
            '    if name != "context_engine":' \
            '        raise KeyError(name)' \
            '    return []' \
            > "$fixture/toolsets.py"
          printf '# offline CI fixture\n' > "$fixture/venv/bin/python"
          printf '# offline CI fixture\n' > "$fixture/hermes"
          python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scout_mvp scripts tests
