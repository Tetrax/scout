name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          fixture="$HOME/.hermes/hermes-agent"
          test ! -e "$fixture"
          umask 077
          mkdir -p "$fixture/venv/bin"
          trap 'rm -rf "$fixture"' EXIT
          printf '%s\n' \
            'TOOLSETS = {"context_engine": {"tools": [], "includes": []}}' \
            'def resolve_toolset(name):' \
            '    if name != "context_engine":' \
            '        raise KeyError(name)' \
            '    return []' \
            > "$fixture/toolsets.py"
          printf '# offline CI fixture\n' > "$fixture/venv/bin/python"
          printf '# offline CI fixture\n' > "$fixture/hermes"
          python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scout_mvp scout_web scripts tests wsgi.py
      - name: Lint the Web application delivery
        run: >-
          python -m ruff check
          scout_web
          scripts/prefetch.py
          tests/test_web_*.py
          wsgi.py

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build immutable Scout image
        run: >-
          docker build
          --build-arg SCOUT_REVISION="$GITHUB_SHA"
          --tag "scout-ci:$GITHUB_SHA"
          .
      - name: Verify image identity and non-root runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect "scout-ci:$GITHUB_SHA" --format '{{.Config.User}}')" = "scout:scout"
          test "$(docker image inspect "scout-ci:$GITHUB_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "scout-ci:$GITHUB_SHA" -c 'import scout_web; from scout_web.app import create_app; assert scout_web.__version__ == "1.0.0"; assert callable(create_app)'
      - name: Verify Compose runtime and healthcheck
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/scout-state"
          runtime_env="$RUNNER_TEMP/scout-runtime.env"
          deployment_env="$RUNNER_TEMP/scout-deployment.env"
          mkdir -p "$state_dir"
          sudo chown 1000:1000 "$state_dir"
          chmod 700 "$state_dir"
          printf '%s\n' \
            'SCOUT_USERNAME=ci' \
            'SCOUT_PASSWORD_HASH=scrypt:32768:8:1$ci$literal' \
            'SCOUT_SECRET_KEY=ci-secret-key-with-at-least-thirty-two-bytes' \
            > "$runtime_env"
          chmod 600 "$runtime_env"
          printf '%s\n' \
            "SCOUT_IMAGE=scout-ci:$GITHUB_SHA" \
            "SCOUT_REVISION=$GITHUB_SHA" \
            'SCOUT_PORT=13739' \
            'SCOUT_UID=1000' \
            'SCOUT_GID=1000' \
            "SCOUT_DATA_DIR=$state_dir" \
            "SCOUT_ENV_FILE=$runtime_env" \
            > "$deployment_env"
          chmod 600 "$deployment_env"
          cleanup() {
            docker compose --project-name scout-ci --env-file "$deployment_env" down --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --project-name scout-ci --env-file "$deployment_env" config --quiet
          docker compose --project-name scout-ci --env-file "$deployment_env" up -d --no-build
          for attempt in $(seq 1 45); do
            health="$(docker inspect scout-web --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ]; then
              docker logs scout-web
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect scout-web --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect scout-web --format '{{.RestartCount}}')" = 0
          test "$(docker inspect scout-web --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          docker exec scout-web python -c 'import os; assert os.environ["SCOUT_PASSWORD_HASH"] == "scrypt:32768:8:1$ci$literal"'
          curl --fail --silent --show-error -H 'Host: localhost' http://127.0.0.1:13739/healthz
          logs="$(docker logs scout-web 2>&1)"
          printf '%s\n' "$logs"
          case "$logs" in
            *'Control server error'*) exit 1 ;;
          esac
