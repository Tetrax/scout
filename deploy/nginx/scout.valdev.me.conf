# Installé sous /etc/nginx/sites-available/scout.valdev.me

server {
    listen 80;
    listen [::]:80;
    server_name scout.valdev.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://scout.valdev.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name scout.valdev.me;

    ssl_certificate /etc/letsencrypt/live/scout.valdev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scout.valdev.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:13741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
